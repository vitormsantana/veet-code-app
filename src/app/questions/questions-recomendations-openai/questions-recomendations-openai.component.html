<div class="recommendations-container">
  <!-- Loading -->
  <div *ngIf="isLoading" class="loading">
    <p>Loading recommendations...</p>
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <!-- Rendered Recommendations -->
  <div *ngIf="!isLoading && parsedRecommendations.length" class="recommendations-table">
    <table>
      <colgroup>
        <col class="col-category" />
        <col class="col-question" />
        <col class="col-reason" />
      </colgroup>
      <thead>
        <tr>
          <th>Category</th>
          <th>Question</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rec of parsedRecommendations">
          <td class="col-category">{{ rec.category }}</td>
          <td class="col-question">{{ rec.question }}</td>
          <td class="col-reason">{{ rec.reason }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!isLoading && !parsedRecommendations.length && rawRecommendations" class="raw-recommendations">
    <pre>{{ rawRecommendations }}</pre>
  </div>
</div>
