<div class="recommendations-container">
  <!-- Loading -->
  <div *ngIf="isLoading" class="loading">
    <p>Loading recommendations...</p>
    <div class="spinner"></div>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
  </div>

  <!-- Rendered Recommendations -->
  <div *ngIf="!isLoading && recommendationsHtml" class="recommendations-table">
    <table>
      <thead>
        <tr>
          <th>Category</th>
          <th>Question</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody [innerHTML]="recommendationsHtml"></tbody>
    </table>
  </div>
</div>
