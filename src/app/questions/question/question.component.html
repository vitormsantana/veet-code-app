<div class="question-container">
  <h2>Insert the Solved LeetCode Question</h2>

  <form [formGroup]="questionForm" (ngSubmit)="submitForm()">
    <mat-form-field appearance="fill">
      <mat-label>Question Name</mat-label>
      <input matInput formControlName="name" required />
      <mat-error *ngIf="questionForm.controls['name'].hasError('required')">This field is required.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Difficulty</mat-label>
      <mat-select formControlName="difficulty">
        <mat-option value="Easy">Easy</mat-option>
        <mat-option value="Medium">Medium</mat-option>
        <mat-option value="Hard">Hard</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Date that question was cracked</mat-label>
      <input matInput formControlName="date" type="date" required />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Minutes taken to solve</mat-label>
      <input matInput type="number" formControlName="minutesTaken" min="1" required />
      <mat-error *ngIf="questionForm.controls['minutesTaken'].hasError('required')">Enter the time spent in minutes.</mat-error>
      <mat-error *ngIf="questionForm.controls['minutesTaken'].hasError('min')">Minutes must be greater than zero.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Tags</mat-label>
      <mat-select formControlName="tags" multiple required>
        <mat-option *ngFor="let tag of availableTags" [value]="tag">{{ tag }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-checkbox formControlName="neededHelp" class="needed-help-checkbox">
      I needed help to complete this question
    </mat-checkbox>

    <button mat-raised-button color="primary" type="submit" [disabled]="questionForm.invalid">Add Question</button>
  </form>

</div>
