<div class="mat-elevation-z8 questions-table-container">
  <div class="status" *ngIf="isLoading">Loading your exercises…</div>
  <div class="status error" *ngIf="!isLoading && errorMessage">{{ errorMessage }}</div>

  <table mat-table [dataSource]="questions" class="mat-table" matSort>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let question">{{ question.name }}</td>
    </ng-container>

    <!-- Date Column -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Resolved Date</th>
      <td mat-cell *matCellDef="let question">{{ question.date }}</td>
    </ng-container>

    <!-- Difficulty Column -->
    <ng-container matColumnDef="difficulty">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Difficulty</th>
      <td mat-cell *matCellDef="let question">{{ question.difficulty }}</td>
    </ng-container>

    <!-- Tags Column -->
    <ng-container matColumnDef="tags">
      <th mat-header-cell *matHeaderCellDef>Tags</th>
      <td mat-cell *matCellDef="let question">{{ question.tags }}</td>
    </ng-container>

    <ng-container matColumnDef="minutesTaken">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Minutes</th>
      <td mat-cell *matCellDef="let question">{{ question.minutesTaken }}</td>
    </ng-container>

    <ng-container matColumnDef="neededHelp">
      <th mat-header-cell *matHeaderCellDef>Needed Help</th>
      <td mat-cell *matCellDef="let question">{{ question.neededHelp ? 'Yes' : 'No' }}</td>
    </ng-container>

    <ng-container matColumnDef="observation">
      <th mat-header-cell *matHeaderCellDef>Observation</th>
      <td mat-cell *matCellDef="let question">{{ question.observation || '—' }}</td>
    </ng-container>

    <!-- Table Header and Rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
