<header class="app-header">
  <h1>Hammocker</h1>

  <nav>
    <button routerLink="/">Home</button>
    <button routerLink="/questions">Questions</button>
    <button routerLink="/studies">Studies</button>
    <span class="auth-status" *ngIf="isAuthenticated">Signed in as {{ userEmail || 'your account' }}</span>
    <span class="auth-status" *ngIf="!isAuthenticated">Not signed in</span>
    <button type="button" (click)="logout()" *ngIf="isAuthenticated">
      Log out
    </button>
    <button routerLink="/login" *ngIf="!isAuthenticated">
      Log in
    </button>
  </nav>
</header>

<div class="content-container">
  <router-outlet></router-outlet>
</div>
