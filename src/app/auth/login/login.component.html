<section class="login-container">
  <h1>Sign in</h1>
  <p class="helper-text">Use your Google account to continue.</p>

  <button
    type="button"
    class="google-button"
    (click)="connectWithGoogle()"
    [disabled]="isProcessingRedirect || isRedirectingToProvider"
  >
    <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <path fill="#4285F4" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 6 .9 8.2 3l5.7-5.7C34.9 6.2 30.7 4 26 4 15.5 4 7 12.5 7 23s8.5 19 19 19 19-8.5 19-19c0-1.3-.1-2.1-.4-3.5z"/>
      <path fill="#34A853" d="M6.3 14.7l6.6 4.8C14.7 15 19 12 24 12c3.1 0 6 .9 8.2 3l5.7-5.7C34.9 6.2 30.7 4 26 4 17.6 4 10.3 8.7 6.3 14.7z"/>
      <path fill="#FBBC05" d="M24 42c4.6 0 8.9-1.8 12.1-4.7l-5.6-4.6C28.4 34.9 26.3 35.6 24 35.6c-5.2 0-9.6-3.3-11.2-7.9l-6.6 5.1C9.9 38.9 16.3 42 24 42z"/>
      <path fill="#EA4335" d="M43.6 20.5H42V20H24v8h11.3c-.7 2.1-2 3.9-3.6 5.2l.1.1 5.6 4.6C39.7 35.5 43 30 43 23c0-1.3-.1-2.1-.4-3.5z"/>
    </svg>
    <span>{{ googleButtonLabel }}</span>
  </button>

  <p class="status" *ngIf="isProcessingRedirect">Finishing sign-in…</p>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</section>
