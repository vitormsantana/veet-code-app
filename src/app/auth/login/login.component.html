<section class="login-container">
  <h1>Sign in</h1>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
    <label for="email">Email</label>
    <input
      id="email"
      type="email"
      formControlName="email"
      autocomplete="email"
      [disabled]="isProcessingRedirect || isRedirectingToProvider"
      [class.invalid]="emailInvalid"
    />
    <p class="error" *ngIf="emailInvalid">Enter a valid email.</p>

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [disabled]="isProcessingRedirect || isRedirectingToProvider"
      [class.invalid]="passwordInvalid"
    />
    <p class="error" *ngIf="passwordInvalid">Password is required.</p>

    <button type="submit" [disabled]="isSubmitting || isProcessingRedirect || isRedirectingToProvider">
      {{ isSubmitting ? 'Signing in…' : 'Continue with email' }}
    </button>
  </form>

  <div class="divider">
    <span>or</span>
  </div>

  <button
    type="button"
    class="google-button"
    (click)="connectWithGoogle()"
    [disabled]="isProcessingRedirect || isRedirectingToProvider"
  >
    {{ isRedirectingToProvider ? 'Redirecting…' : 'Continue with Google' }}
  </button>

  <p class="status" *ngIf="isProcessingRedirect">Finishing sign-in…</p>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
</section>
